.hi-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hi-img .ph{position:relative;z-index:1}
.hi-body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.hi-n{font-size:14.5px;font-weight:600;margin:0 0 6px;line-height:1.35}
.hi-note{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px;line-height:1.6;color:#5C635C;margin:0 0 14px}

/* ── Toast + confetti ── */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;background:#1F2420;color:#FBFAF7;padding:13px 20px;border-radius:2px;font-size:13px;box-shadow:0 12px 40px rgba(31,36,32,.22);animation:riseIn .3s ease;max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:0;display:block}
</style>

/* ── State ── */
var state = {
  cat: "all", maxPrice: 1200,
  reserved: {}, contrib: {},
  modal: null, mode: "envio", amount: 50, giver: "", note: "",
  shared: false, extras: {}, card: 0, step: "modo", error: "", lastMsg: ""
};

/* ── Helpers ── */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function eur(v){ return v.toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " €"; }
function canShare(p){ return p.price > SHARE_MIN; }
function isTaken(p){
  if (state.reserved[p.id]) return true;
  if (canShare(p)) return (state.contrib[p.id] || 0) >= p.price;
  return false;
}
function store(p){
  try {
    var h = new URL(p.url).hostname;
    return STORES[h] || h.replace("www.", "");
  } catch (e) { return ""; }
}
function remainOf(m){
  return m && canShare(m) ? Math.max(0, m.price - (state.contrib[m.id] || 0)) : 0;
}
function $(id){ return document.getElementById(id); }

/* ── Persistence ── */
function loadState(){
  var seed = {};
  PRODUCTS.forEach(function(p){ if (p.t) seed[p.id] = { mode: "envio" }; });
  var stored = {};
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) stored = JSON.parse(raw) || {};
  } catch (e) {}
  state.reserved = Object.assign(seed, stored.reserved || {});
  state.contrib = stored.contrib || {};
}
function persist(){
  try {
    localStorage.setItem(KEY, JSON.stringify({ reserved: state.reserved, contrib: state.contrib }));
  } catch (e) {}
}

/* ── Sincronización con Google Sheet (opcional) ── */
function syncPull(){
  if (!SHEET_URL) return;
  fetch(SHEET_URL, { method: "GET" })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || typeof data !== "object") return;
      var seed = {};
      PRODUCTS.forEach(function(p){ if (p.t) seed[p.id] = { mode: "envio" }; });
      state.reserved = Object.assign(seed, data.reserved || {});
      state.contrib = data.contrib || {};
      persist();
      renderGrid(); renderProgress(); renderHighlights();
      if (state.modal) renderModal();
    })
    .catch(function(){ /* sin conexión: seguimos con lo local */ });
}
function syncPush(payload){
  if (!SHEET_URL) return;
  fetch(SHEET_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita el preflight CORS
    body: JSON.stringify(payload)
  })
  .then(function(){ syncPull(); })
  .catch(function(){ /* se reintenta al recargar */ });
}

/* ── Decorate a product for display ── */
function decorate(p){
  var taken = isTaken(p);
  var got = state.contrib[p.id] || 0;
  var isGroup = canShare(p) && !taken;
  return Object.assign({}, p, {
    catLabel: CAT_LABELS[p.c] || "",
    noImg: !p.img,
    taken: taken,
    op: taken ? ".45" : "1",
    isGroup: isGroup,
    pct: Math.min(100, Math.round(got / p.price * 100)) + "%",
    groupLine: got > 0
      ? eur(got) + " de " + eur(p.price) + " · faltan " + eur(p.price - got)
      : "Se puede compartir entre varios",
    cta: isGroup ? "Reservar o aportar" : "Reservar"
  });
}

function getItems(){
  var items = PRODUCTS.filter(function(p){
    return (state.cat === "all" || p.c === state.cat) &&
           (p.price <= state.maxPrice || state.maxPrice >= 1200);
  });
  items = items.slice().sort(function(a, b){
    return (isTaken(a) ? 1 : 0) - (isTaken(b) ? 1 : 0);
  });
  return items.map(decorate);
}

/* ── Renderers ── */
function renderCountdown(){
  var days = Math.max(0, Math.ceil((DUE - new Date()) / 86400000));
  var cdMonths = Math.floor(days / 30.44);
  var cdWeeks = Math.floor((days - cdMonths * 30.44) / 7);
  var cdDays = Math.max(0, Math.round(days - cdMonths * 30.44 - cdWeeks * 7));
  $("cd-months").textContent = cdMonths;
  $("cd-weeks").textContent = cdWeeks;
  $("cd-days").textContent = cdDays;
}

function renderChips(){
  var nodes = document.querySelectorAll("#chips .chip");
  for (var i = 0; i < nodes.length; i++){
    nodes[i].classList.toggle("active", nodes[i].dataset.k === state.cat);
  }
}

function updateMaxLabel(){
  $("max-label").textContent = "Hasta " + (state.maxPrice >= 1200 ? "sin límite" : eur(state.maxPrice));
}

function renderProgress(){
  var total = PRODUCTS.length;
  var takenList = PRODUCTS.filter(isTaken);
  var pct = total ? Math.round(takenList.length / total * 100) : 0;

    ? takenList.length + " de " + total + " regalos ya tienen dueño. " + (total - takenList.length) + " siguen libres."

              '<p class="hi-n">' + esc(h.n) + '</p>' +

function renderGrid(){

function renderModal(){
  var root = $("modal-root");
  var m = state.modal;
  if (!m){ root.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";

  var kicker = state.step === "done"
    ? "Reserva hecha"
    : (state.shared ? "Regalo entre varios" : "Reservar regalo");

  var body = "";
  if (state.step === "tipo") body = tipoHTML(m);
  else if (state.step === "modo") body = modoHTML(m);
  else if (state.step === "postal") body = postalHTML(m);
  else if (state.step === "done") body = doneHTML();

  root.innerHTML =
    '<div class="backdrop" data-act="backdrop">' +
      '<div class="sheet" data-act="stop">' +
        '<p class="m-kicker">' + kicker + '</p>' +
        '<p class="m-title">' + esc(m.n) + '</p>' +
        '<p class="m-price">' + esc(m.p) + '</p>' +
        body +
      '</div>' +
    '</div>';

  var g = $("f-giver");
  if (g) g.addEventListener("input", function(){
    state.giver = g.value;
    var er = $("m-error");
    if (er) er.remove();
    g.classList.remove("err");
  });
  var n = $("f-note");
  if (n) n.addEventListener("input", function(){ state.note = n.value; });
}

/* ── Flow actions ── */
function open(p){
  var giver = "";
  try { giver = (JSON.parse(localStorage.getItem(KEY + "-me") || "{}")).giver || ""; } catch (e) {}
  var big = canShare(p);
  state.modal = p;
  state.step = big ? "tipo" : "modo";
  state.error = "";
  state.note = "";
  state.giver = giver;
  state.shared = false;
  state.extras = {};
  state.card = 0;
  state.mode = "envio";
  state.amount = Math.min(50, Math.max(10, Math.round((p.price - (state.contrib[p.id] || 0)) / 4 / 5) * 5));
  renderModal();
}
function goModo(){
  state.step = "modo";
  state.error = "";
  state.mode = state.shared ? "bizum" : "envio";
  renderModal();
}
function goPostal(){
  if (state.giver.trim().length < 2){
    state.error = "Escribe tu nombre para que sepamos de quién es el regalo.";
    renderModal();
    return;
  }
  state.step = "postal";
  state.error = "";
  renderModal();
}
function backToModo(){
  state.step = "modo";
  state.error = "";
  renderModal();
}
function back(){
  if (state.modal && canShare(state.modal)){
    state.step = "tipo";
    state.error = "";
    renderModal();
  } else {
    closeModal();
  }
}
function closeModal(){
  state.modal = null;
  renderModal();
}
function confirmReserve(){
  var p = state.modal;
  if (!p) return;
  var who = state.giver.trim();
  var isGroup = state.shared && canShare(p);
  var nota = state.note.trim();
  var pc = POSTCARDS[state.card];
  var postal = nota ? " Le dejo esta postal (" + pc.icon + " " + pc.name + "): «" + nota + "» — " + who : "";
  var extraList = PRODUCTS.filter(function(x){ return state.extras[x.id]; });
  var extraTxt = extraList.length
    ? " Y de la misma web (" + store(p) + ") cojo también: " + extraList.map(function(x){ return x.n + " (" + x.p + ")"; }).join(", ") + "."
    : "";
  var msg;
  if (isGroup){
    msg = "¡Hola! Soy " + who + ". Quiero aportar " + eur(state.amount) + " al regalo compartido \"" + p.n + "\" de la lista de Nahia. ¿Me mandáis el número de Bizum?" + postal;
  } else if (state.mode === "envio"){
    msg = "¡Hola! Soy " + who + ". Reservo \"" + p.n + "\" de la lista de Nahia: lo compro yo y os lo envío, ¿me dais la dirección?" + extraTxt + postal;
  } else {
    msg = "¡Hola! Soy " + who + ". Reservo \"" + p.n + "\"" + (extraList.length ? " y " + extraList.length + " cosa(s) más de " + store(p) : "") + " de la lista de Nahia y os hago un Bizum. ¿Me mandáis el número?" + extraTxt + postal;
  }
  try { localStorage.setItem(KEY + "-me", JSON.stringify({ giver: who })); } catch (e) {}

  var reserved = Object.assign({}, state.reserved);
  var contrib = Object.assign({}, state.contrib);
  if (isGroup){
    contrib[p.id] = Math.min(p.price, (contrib[p.id] || 0) + state.amount);
    if (contrib[p.id] >= p.price) reserved[p.id] = { mode: "group" };
  } else {
    reserved[p.id] = { mode: state.mode, giver: who };
    extraList.forEach(function(x){ reserved[x.id] = { mode: state.mode, giver: who }; });
  }
  state.reserved = reserved;
  state.contrib = contrib;
  persist();

  syncPush({
    id: p.id,
    producto: p.n,
    nombre: who,
    metodo: isGroup ? "Entre varios" : (state.mode === "envio" ? "Envío" : "Bizum"),
    importe: isGroup ? state.amount : "",
    completo: isGroup ? (contrib[p.id] >= p.price) : true,
    postal: nota ? (pc.icon + " " + pc.name + ": " + nota) : "",
    extras: extraList.map(function(x){ return { id: x.id, n: x.n }; }),
    mensaje: msg
  });

  state.step = "done";
  state.error = "";
  state.lastMsg = msg;
  renderModal();
  renderGrid();
  renderProgress();
  renderHighlights();
  celebrate();
}
function sendWhatsApp(){
  window.open("https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(state.lastMsg), "_blank");
  state.modal = null;
  renderModal();
  toast("🌿 Gracias de verdad. Te contestamos con la dirección o el número de Bizum enseguida.");
}
function share(){
  var txt = "Nahia llega el 27 de noviembre 🌿 Esta es su lista de regalos: " + location.href;
  if (navigator.share){
    navigator.share({ title: "Lista de regalos de Nahia", text: txt }).catch(function(){});
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  }
}

/* ── Toast + confetti ── */
var _tt, _ct;
function toast(msg){
  var r = $("toast-root");
  r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(_tt);
  _tt = setTimeout(function(){ r.innerHTML = ""; }, 6000);
}
function celebrate(){
  if (!CONFETTI) return;
  var r = $("confetti-root");
  var colors = ["#8AA792", "#B4796A", "#E4D9BE", "#47614F"];
  var html = "";
  for (var i = 0; i < 22; i++){
    var big = i % 3 === 0;
    html += '<span style="' +
      'left:' + (4 + i * 4.3) + '%;' +
      'width:' + (big ? 9 : 6) + 'px;height:' + (big ? 9 : 6) + 'px;' +
      'border-radius:' + (i % 2 ? "50%" : "1px") + ';' +
      'background:' + colors[i % 4] + ';' +
      '--dx:' + ((i % 5) - 2) * 34 + 'px;' +
      '--rot:' + (240 + i * 37) + 'deg;' +
      'animation:fall ' + (2.2 + (i % 5) * 0.35) + 's cubic-bezier(.3,.1,.6,1) ' + (i % 7) * 0.08 + 's forwards' +
    '"></span>';
  }
  r.innerHTML = '<div class="confetti">' + html + '</div>';
  clearTimeout(_ct);
  _ct = setTimeout(function(){ r.innerHTML = ""; }, 3600);
}

/* ── Image slots (user-fillable, persisted per browser) ── */
function slotKey(sid){ return "nahia-img-" + sid; }
function applySlot(slot){
  var data = null;
  try { data = localStorage.getItem(slotKey(slot.dataset.sid)); } catch (e) {}
  if (data){
    slot.style.backgroundImage = "url(" + data + ")";
    slot.classList.add("filled");
  } else {
    slot.style.backgroundImage = "";
    slot.classList.remove("filled");
  }
}
function readImage(f, slot){
  if (!f || !/^image\//.test(f.type)) return;
  var rd = new FileReader();
  rd.onload = function(){
    try { localStorage.setItem(slotKey(slot.dataset.sid), rd.result); }
    catch (e) { toast("La imagen es demasiado grande para guardarla en este navegador."); return; }
    applySlot(slot);
  };
  rd.readAsDataURL(f);
}
function pickImage(slot){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = function(){ if (inp.files[0]) readImage(inp.files[0], slot); };
  inp.click();
}
function upgradeSlots(){
  var slots = document.querySelectorAll(".img-slot");
  for (var i = 0; i < slots.length; i++){
    var slot = slots[i];
    if (!slot._up){
      slot._up = true;
      (function(s){
        s.addEventListener("click", function(){ pickImage(s); });
        s.addEventListener("dragover", function(e){ e.preventDefault(); s.classList.add("drag"); });
        s.addEventListener("dragleave", function(){ s.classList.remove("drag"); });
        s.addEventListener("drop", function(e){
          e.preventDefault();
          s.classList.remove("drag");
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) readImage(f, s);
        });
      })(slot);
    }
    applySlot(slot);
  }
}

/* ── Click delegation ── */
function delegatedClick(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act;
  switch (a){
    case "stop": return;
    case "backdrop": return closeModal();
    case "share": return share();
    case "cat":
      state.cat = el.dataset.k;
      renderChips();
      renderGrid();
      return;
    case "reset": {
      state.cat = "all";
      state.maxPrice = 1200;
      var r = $("max-range");
      if (r) r.value = 1200;
      updateMaxLabel();
      renderChips();
      renderGrid();
      return;
    }
    case "open": {
      var p = PRODUCTS.filter(function(x){ return x.id === el.dataset.id; })[0];
      if (p) open(p);
      return;
    }
    case "pickSolo": state.shared = false; return renderModal();
    case "pickShared": state.shared = true; return renderModal();
    case "goModo": return goModo();
    case "closeModal": return closeModal();
    case "pickEnvio": state.mode = "envio"; return renderModal();
    case "pickBizum": state.mode = "bizum"; return renderModal();
    case "amount": state.amount = +el.dataset.v; return renderModal();
    case "extra": {
      var k = el.dataset.id;
      if (state.extras[k]) delete state.extras[k];
      else state.extras[k] = true;
      return renderModal();
    }
    case "back": return back();
    case "goPostal": return goPostal();
    case "card": state.card = +el.dataset.i; return renderModal();
    case "backToModo": return backToModo();
    case "confirm": return confirmReserve();
    case "sendWhatsApp": return sendWhatsApp();
  }
}

(function init(){
  $("app").innerHTML = shellHTML();
  loadState();

  renderCountdown();
  renderChips();
  updateMaxLabel();
  renderProgress();
  renderHighlights();
  renderGrid();
  upgradeSlots();
  renderModal();

  $("max-range").addEventListener("input", function(e){
    state.maxPrice = +e.target.value;
    updateMaxLabel();
    renderGrid();
  });
  document.addEventListener("click", delegatedClick);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && state.modal) closeModal();
  });
  setInterval(renderCountdown, 60000);

  syncPull();                                   // trae lo ya reservado por otros
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) syncPull();           // al volver a la pestaña, refresca
  });
})();
</script>
</body>
</html>
